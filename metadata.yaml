short-description: "采集千川素材的投放、人群、脚本与互动事实，形成支持自定义分析的数据工作台"
tags:
  - 千川
requires:
  env:
    - ENV_BACKEND_HOST
    - YUCE_AUTHORIZATION
    - YUCE_SESSION_ID
    - YCSESSIONID
market:
  title: "千川素材数据工作台"
  summary: "按店铺、广告主和日期范围采集千川素材及诊断事实，沉淀可审计的数据资产，支持客户后续自定义分析与内容经营。"
  category:
    key: short_video_content
    label: 短视频内容
  icon: assets/icon.png
  cover: assets/cover.png
  sop:
    title: 千川元技能介绍说明书
    url: https://sample-cube.yuce-tech.cn/api/v1/yucegpt/file_system/view/ws_bfb0d041t5bd9t4f/reports/2026-09-30/%E5%8D%83%E5%B7%9D%E7%B4%A0%E6%9D%90%E6%95%B0%E6%8D%AE%E5%B7%A5%E4%BD%9C%E5%8F%B0%E8%AF%B4%E6%98%8E%E4%B9%A6V4.0/index.html
  badges:
    - label: 千川
      tone: blue
  examples:
    - title: 千川素材数据采集
      prompt: "采集指定店铺目标周期内的千川素材、投放表现和详情事实，形成可审计数据工作台"
    - title: 高光帧数据提取
      prompt: "提取千川素材中的点击与互动高光时刻，为后续自定义分析提供证据"
    - title: 已有数据继续分析
      prompt: "基于已有数据提炼优质素材共性，形成内容优化建议"
pre_input: |
  请采集千川素材及相关诊断数据
  千川授权店铺：__field:api_shop__（必填）
  千川广告主ID：__field:rpa_shop__（必填）
  时间范围：__field:date_range__
  详情素材数：__field:top_n__（包含互动时序、人群、脚本和高光帧数据，默认10）
  素材筛选与排序：__field:material_filter_sort__（可选；例如筛选“整体消耗”>=10000，再按“净成交ROI”降序；未填写条件时不加筛选，默认按“整体消耗”降序排列）。
  是否同时生成高光帧图片：__field:highlight_mode__（选择否时无需填写高光帧规则）
  高光帧规则：__field:highlight_rules__（选择是时填写；可用指标：整体点击次数、整体流失数、整体点赞次数、整体评论次数、整体转发次数、整体新增粉丝数；规则案例：保留封面，提取整体点击次数局部峰值3帧、整体转发次数最高值2帧，不提取其他指标）
skill_form:
  - key: api_shop
    type: api_shop
    label: 千川授权店铺
    description: 从千川 API 已授权店铺中选择；只用于第一步素材报表查询
    application_id: OCEANENGINE
    multiple: false
    required: true
  - key: rpa_shop
    type: rpa_shop
    label: 千川广告主ID
    description: 选择 account 为千川广告主 ID 的 RPA 授权账号；执行前核对该 ID 属于所选 API 店铺，授权项 ID 仅用于逐素材诊断
    application_id: RPA_JULIANG_QC
    value_format: both
    multiple: false
    required: true
  - key: date_range
    type: daterange
    label: 时间范围
    description: 对应起止日期，日期格式为 YYYY-MM-DD；不含执行日和前一日
    placeholder: "开始日期,结束日期"
    format: YYYY-MM-DD
    value_format: YYYY-MM-DD
    max_policy: t_plus_2
    required: true
  - key: top_n
    type: number
    label: 详情素材数
    description: 需要获取互动时序、人群、脚本和可选高光帧详情的素材数量
    required: true
    default: 10
    min: 1
    step: 1
    precision: 0
    addon_after: 条
  - key: material_filter_sort
    type: textarea
    label: 筛选与排序条件
    description: 可选；用自然语言描述指标阈值、排序字段和方向；不填写则不加筛选，默认按整体消耗降序排列
    placeholder: "例如：整体消耗 >= 10000，再按净成交 ROI 降序"
    required: false
    rows: 3
  - key: highlight_mode
    type: select
    label: 是否生成高光帧
    description: 选择否时不生成也不校验高光帧规则；选择是时填写下方自然语言规则
    required: true
    default: "off"
    options:
      - label: 否
        value: "off"
      - label: 是
        value: "on"
  - key: highlight_rules
    type: textarea
    label: 高光帧规则
    description: 直接描述是否保留封面、使用的指标、提取方式和每个指标的帧数
    placeholder: "例如：保留封面，提取整体点击次数局部峰值3帧、整体转发次数最高值2帧，不提取其他指标"
    required: true
    rows: 4
    max_length: 4000
    visible_when:
      field: highlight_mode
      equals: "on"
    depends_on:
      highlight_mode: "on"
