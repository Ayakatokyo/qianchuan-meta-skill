short-description: "采集千川素材的投放、人群、脚本与互动事实，形成支持自定义分析的数据工作台"
tags:
  - 千川
compatibility:
  - data-analysis
  - python
  - html-report
requires:
  env:
    - ENV_BACKEND_HOST
    - YUCE_AUTHORIZATION
    - YUCE_SESSION_ID
    - YCSESSIONID
market:
  title: "千川素材数据工作台"
  summary: "按店铺、广告主和日期范围采集千川素材及诊断事实，沉淀可审计的数据资产，支持客户后续自定义分析与内容经营。"
  category:
    key: short_video_content
    label: 短视频内容
  badges:
    - label: 千川
      tone: blue
  examples:
    - title: 千川素材数据采集
      prompt: "采集指定店铺目标周期内的千川素材、投放表现和详情事实，形成可审计数据工作台"
    - title: 高光帧数据提取
      prompt: "提取千川素材中的点击与互动高光时刻，为后续自定义分析提供证据"
    - title: 已有数据继续分析
      prompt: "基于已有数据提炼优质素材共性，形成内容优化建议"
skill_form:
  - key: api_shop
    type: api_shop
    label: 千川授权店铺
    description: 从千川 API 已授权店铺中选择；只用于第一步素材报表查询
    application_id: OCEANENGINE
    multiple: false
    required: true
  - key: advertiser_id
    type: api_advertiser
    label: 千川广告主（ID）
    description: 先选择报表授权店铺，再从该店铺的已授权广告主中选择；用于第一步素材报表查询
    application_id: OCEANENGINE
    shop_field: api_shop
    required: true
  - key: rpa_shop
    type: rpa_shop
    label: 千川广告主
    description: 请选择与广告主同一投放主体的千川 RPA 已授权账号；只用于第二步逐素材诊断，ID 格式不同，不直接比较
    application_id: RPA_JULIANG_QC
    value_format: both
    multiple: false
    required: true
  - key: date_range
    type: daterange
    label: 时间范围
    description: 对应起止日期，日期格式为 YYYY-MM-DD；不含执行日和前一日
    placeholder: "开始日期,结束日期"
    format: YYYY-MM-DD
    value_format: YYYY-MM-DD
    max_policy: t_plus_2
    required: true
  - key: top_n
    type: number
    label: 详情素材数
    description: 需要获取互动时序、人群、脚本和可选高光帧详情的素材数量
    required: true
    default: 10
    min: 1
    step: 1
    precision: 0
    addon_after: 条
  - key: material_filter_sort
    type: textarea
    label: 筛选与排序条件
    description: 可选；用自然语言描述指标阈值、排序字段和方向；不填写则保留连接器原始顺序
    placeholder: "例如：整体消耗 >= 10000，再按净成交 ROI 降序"
    required: false
    rows: 3
  - key: highlight_mode
    type: select
    label: 是/否
    description: 选择否时，以下高光帧字段不参与填写；选择是时，至少选择一个高光指标
    required: true
    default: "off"
    options:
      - label: 否
        value: "off"
      - label: 是
        value: "on"
  - key: highlight_include_cover
    type: select
    label: 是/否
    description: 选择是否把视频封面加入高光帧结果
    required: true
    default: "true"
    options:
      - label: 是
        value: "true"
      - label: 否
        value: "false"
    visible_when:
      field: highlight_mode
      equals: "on"
    depends_on:
      highlight_mode: "on"

  - key: highlight_click_enabled
    type: select
    label: 是否选择
    required: true
    default: "false"
    options:
      - label: 是
        value: "true"
      - label: 否
        value: "false"
    visible_when:
      field: highlight_mode
      equals: "on"
    depends_on:
      highlight_mode: "on"
  - key: highlight_click_strategy
    type: select
    label: 局部峰值/最高值
    options:
      - label: 局部峰值
        value: local_peaks
      - label: 最高值
        value: global_top_values
    default: local_peaks
    required: true
    depends_on:
      highlight_mode: "on"
      highlight_click_enabled: "true"
  - key: highlight_click_limit
    type: number
    label: 帧数
    default: 2
    min: 1
    step: 1
    precision: 0
    addon_after: 帧
    required: true
    depends_on:
      highlight_mode: "on"
      highlight_click_enabled: "true"

  - key: highlight_loss_enabled
    type: select
    label: 是否选择
    required: true
